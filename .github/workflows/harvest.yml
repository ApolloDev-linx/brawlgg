name: Daily Harvest

on:
  schedule:
    # 4 AM UTC daily (adjust to your preference)
    - cron: '0 4 * * *'
  workflow_dispatch:  # lets you trigger manually from GitHub UI too

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run harvester
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BRAWL_STARS_API_KEY: ${{ secrets.BRAWL_STARS_API_KEY }}
          BRAWL_STARS_PROXY_URL: ${{ secrets.BRAWL_STARS_PROXY_URL }}

        run: npx tsx scripts/harvest.ts

      - name: Run aggregator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/aggregate.ts
